name: ShopPluginMc
version: 1.0.0
main: com.flovex.shop.ShopPluginMc
api-version: '1.21'
author: Flovex
softdepend: [Vault, PlaceholderAPI, CoinsEngine]
commands:
  shop:
    description: Opens shop categories
    usage: /shop [category]
    permission: flovexshop.use
  shardshop:
    description: Opens external shard shop
    permission: flovexshop.use
  flovexshop:
    description: Shop administration
    usage: /flovexshop reload
    permission: flovexshop.admin
permissions:
  flovexshop.use:
    default: true
  flovexshop.admin:
    default: op
  flovexshop.reload:
    default: op
