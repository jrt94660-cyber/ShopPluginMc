name: SKShop
version: 1.1.0
main: com.flovex.shop.ShopPluginMc
api-version: '1.21'
author: SKShop
commands:
  shop:
    description: Opens shop
    usage: /shop [category]
    permission: skshop.use
  flovexshop:
    description: Admin command
    usage: /flovexshop reload
    permission: flovexshop.admin
permissions:
  flovexshop.use:
    default: true
  flovexshop.admin:
    default: op
