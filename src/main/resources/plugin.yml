name: ShopPluginMc
version: 1.2.0
main: com.flovex.shop.ShopPluginMc
api-version: '1.21'
author: ShopPluginMc
commands:
  shop:
    description: Opens shop
    usage: /shop [category]
    permission: mcshop.use
  mcshop:
    description: Admin command
    usage: /mcshop reload
    permission: mcshop.admin
permissions:
  mcshop.use:
    default: true
  mcshop.admin:
    default: op
